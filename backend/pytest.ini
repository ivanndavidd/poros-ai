[pytest]
testpaths = tests
# Run in parallel by default — the suite is ~585 tests and almost entirely I/O-bound
# (Postgres round-trips), so wall-clock scales well with workers.
#
# --dist loadfile keeps every test in a FILE on one worker. Several modules call
# store.init() at import time and share module-level state across their tests;
# splitting a file across workers would make that state depend on scheduling.
#
# Each worker gets its own Postgres schema + DuckDB sample file + documents dir
# (tests/conftest.py, keyed on PYTEST_XDIST_WORKER).
#
# Debugging a single failure: add `-n0` to run serially (needed for --pdb and -x).
addopts = -n auto --dist loadfile
