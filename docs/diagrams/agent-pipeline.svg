<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="600">Feature 2: one governed pipeline every consumer inherits</text>

  <!-- row 1: intake, centered over the tools -->
  <rect x="40" y="50" width="120" height="56" fill="#eef2ff" stroke="#c7d2fe" rx="6"/>
  <text x="50" y="72" font-size="11" font-weight="600">Question</text>
  <text x="50" y="88" font-size="10.5">+ role, user id,</text>
  <text x="50" y="101" font-size="10.5">chat history</text>

  <rect x="212" y="50" width="120" height="56" fill="#f7f8fa" stroke="#c8ccd4" rx="6"/>
  <text x="222" y="72" font-size="11" font-weight="600">Gatekeeper</text>
  <text x="222" y="88" font-size="10.5">screen for</text>
  <text x="222" y="101" font-size="10.5">injection, scope</text>

  <rect x="384" y="50" width="120" height="56" fill="#f7f8fa" stroke="#c8ccd4" rx="6"/>
  <text x="394" y="72" font-size="11" font-weight="600">Router</text>
  <text x="394" y="88" font-size="10.5">pick model by</text>
  <text x="394" y="101" font-size="10.5">complexity</text>

  <rect x="556" y="50" width="130" height="56" fill="#f7f8fa" stroke="#c8ccd4" rx="6"/>
  <text x="566" y="72" font-size="11" font-weight="600">Planner / agent</text>
  <text x="566" y="88" font-size="10.5">choose tools,</text>
  <text x="566" y="101" font-size="10.5">gated per role</text>

  <line x1="160" y1="78" x2="212" y2="78" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <line x1="332" y1="78" x2="384" y2="78" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <line x1="504" y1="78" x2="556" y2="78" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>

  <!-- planner fans DOWN to the three tools via one shared bus (no crossing) -->
  <line x1="621" y1="106" x2="621" y2="140" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="150" y1="140" x2="621" y2="140" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="150" y1="140" x2="150" y2="172" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <line x1="370" y1="140" x2="370" y2="172" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <line x1="560" y1="140" x2="560" y2="172" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>

  <!-- row 2: tools -->
  <rect x="60" y="174" width="180" height="86" fill="#ffffff" stroke="#374151" rx="6"/>
  <text x="70" y="193" font-size="11" font-weight="600">run_sql (loop, max 6)</text>
  <text x="70" y="209" font-size="10.5">generate SQL, govern(),</text>
  <text x="70" y="223" font-size="10.5">cost guard, run</text>
  <text x="70" y="238" font-size="10.5" fill="#6b7280">errors fed back to self-correct;</text>
  <text x="70" y="251" font-size="10.5" fill="#6b7280">rows PII-masked to the model</text>

  <rect x="280" y="174" width="180" height="86" fill="#ffffff" stroke="#374151" rx="6"/>
  <text x="290" y="193" font-size="11" font-weight="600">search_docs (RAG)</text>
  <text x="290" y="209" font-size="10.5">embed, cosine recall,</text>
  <text x="290" y="223" font-size="10.5">cross-encoder rerank</text>
  <text x="290" y="238" font-size="10.5" fill="#6b7280">tenant + per-chunk role ACL;</text>
  <text x="290" y="251" font-size="10.5" fill="#6b7280">weak hits trigger one rewrite</text>

  <rect x="500" y="174" width="180" height="86" fill="#ffffff" stroke="#374151" rx="6"/>
  <text x="510" y="193" font-size="11" font-weight="600">recall_memory</text>
  <text x="510" y="209" font-size="10.5">durable notes for this</text>
  <text x="510" y="223" font-size="10.5">(tenant, user) only</text>
  <text x="510" y="238" font-size="10.5" fill="#6b7280">gated by persistent +</text>
  <text x="510" y="251" font-size="10.5" fill="#6b7280">cross_session_recall</text>

  <!-- tools converge DOWN into synthesize via one shared bus -->
  <line x1="150" y1="260" x2="150" y2="292" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="370" y1="260" x2="370" y2="292" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="590" y1="260" x2="590" y2="292" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="150" y1="292" x2="590" y2="292" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="370" y1="292" x2="370" y2="326" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <text x="384" y="284" font-size="9.5" fill="#6b7280">evidence</text>

  <!-- row 3: synthesize + verifier -->
  <rect x="266" y="328" width="208" height="70" fill="#f0fdf4" stroke="#86efac" rx="6"/>
  <text x="276" y="349" font-size="11" font-weight="600">Synthesize answer</text>
  <text x="276" y="366" font-size="10.5">grounded in evidence, with</text>
  <text x="276" y="380" font-size="10.5">SQL + citations shown</text>

  <rect x="540" y="328" width="200" height="70" fill="#fef2f2" stroke="#fecaca" rx="6"/>
  <text x="550" y="349" font-size="11" font-weight="600">Verifier (rule-based)</text>
  <text x="550" y="366" font-size="10.5">grounding, citations,</text>
  <text x="550" y="380" font-size="10.5">numbers-without-SQL, PII ask</text>

  <!-- verify / repair loop: two clearly separated horizontal arrows -->
  <line x1="474" y1="350" x2="540" y2="350" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <text x="480" y="344" font-size="9.5" fill="#6b7280">verify</text>
  <line x1="540" y1="378" x2="474" y2="378" stroke="#4b5563" stroke-width="1.4" marker-end="url(#p)"/>
  <text x="480" y="392" font-size="9.5" fill="#6b7280">repair once, keep if better</text>

  <!-- auto-memory: background, off to the left -->
  <rect x="40" y="334" width="200" height="58" fill="#fff7ed" stroke="#fdba74" rx="6"/>
  <text x="50" y="354" font-size="11" font-weight="600">Auto-memory (background)</text>
  <text x="50" y="370" font-size="10.5">LLM extracts up to 3 durable</text>
  <text x="50" y="384" font-size="10.5">facts about the user; deduped</text>
  <line x1="266" y1="363" x2="240" y2="363" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pd)"/>

  <text x="20" y="436" font-size="10" fill="#6b7280">Every SQL step routes through govern(); result rows are masked before any model call, while the API response keeps real values.</text>
  <text x="20" y="454" font-size="10" fill="#6b7280">The pipeline is global. All tenants and consumer apps inherit the same path, configured only by per-tenant data and per-role policy.</text>
</svg>
