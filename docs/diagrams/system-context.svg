<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600">Poros system context (deployment as of 2026-07-07)</text>

  <!-- zones -->
  <rect x="16" y="44" width="212" height="552" fill="none" stroke="#b91c1c" stroke-dasharray="6 4" rx="6"/>
  <text x="26" y="62" fill="#b91c1c" font-size="11" font-weight="600">OFFICE LAN</text>
  <rect x="244" y="44" width="440" height="552" fill="none" stroke="#b91c1c" stroke-dasharray="6 4" rx="6"/>
  <text x="254" y="62" fill="#b91c1c" font-size="11" font-weight="600">BACKEND HOST (Windows workstation)</text>
  <rect x="700" y="44" width="244" height="552" fill="none" stroke="#b91c1c" stroke-dasharray="6 4" rx="6"/>
  <text x="710" y="62" fill="#b91c1c" font-size="11" font-weight="600">INTERNET</text>

  <!-- LAN actors -->
  <rect x="32" y="100" width="180" height="80" fill="#eef2ff" stroke="#c7d2fe" rx="4"/>
  <text x="42" y="122" font-weight="600">Admin operator browser</text>
  <text x="42" y="140" font-size="11">React console (Vite dev, :5173)</text>
  <text x="42" y="157" font-size="11" fill="#6b7280">X-Admin-Key in localStorage</text>
  <text x="42" y="173" font-size="11" fill="#6b7280">loads fonts + map CDN itself</text>

  <rect x="32" y="204" width="180" height="80" fill="#eef2ff" stroke="#c7d2fe" rx="4"/>
  <text x="42" y="226" font-weight="600">Consumer apps</text>
  <text x="42" y="244" font-size="11">Maintenance App (Laravel)</text>
  <text x="42" y="261" font-size="11">+ any app with an API key</text>
  <text x="42" y="277" font-size="11" fill="#6b7280">API key + end-user JWT</text>

  <rect x="32" y="330" width="180" height="80" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="42" y="352" font-weight="600">MySQL warehouses (2)</text>
  <text x="42" y="370" font-size="11">Maintenance (51 tables)</text>
  <text x="42" y="387" font-size="11">Central (10 tables)</text>
  <text x="42" y="403" font-size="11" fill="#b91c1c">cleartext TCP 3306</text>

  <!-- backend container -->
  <rect x="260" y="80" width="416" height="300" fill="#ffffff" stroke="#374151" stroke-width="1.4" rx="6"/>
  <text x="272" y="100" font-weight="600">Poros backend, FastAPI 0.2.0</text>
  <text x="272" y="115" font-size="10.5" fill="#b91c1c">uvicorn 0.0.0.0:8000, plain HTTP, --reload</text>

  <rect x="272" y="124" width="190" height="48" fill="#eef2ff" stroke="#c7d2fe" rx="4"/>
  <text x="280" y="141" font-size="11" font-weight="600">Auth</text>
  <text x="280" y="156" font-size="10.5">admin key; consumer API key + JWT</text>
  <text x="280" y="168" font-size="10.5" fill="#6b7280">JWT role drives governance</text>

  <rect x="474" y="124" width="190" height="48" fill="#fef2f2" stroke="#fecaca" rx="4"/>
  <text x="482" y="141" font-size="11" font-weight="600">govern() choke point</text>
  <text x="482" y="156" font-size="10.5">read-only, tables, CLAC, RLAC</text>
  <text x="482" y="168" font-size="10.5" fill="#6b7280">all SQL passes here</text>

  <rect x="272" y="180" width="190" height="40" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="280" y="197" font-size="11" font-weight="600">/admin routers</text>
  <text x="280" y="212" font-size="10.5">tenants, models, docs, memory</text>

  <rect x="474" y="180" width="190" height="40" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="482" y="197" font-size="11" font-weight="600">Connectors</text>
  <text x="482" y="212" font-size="10.5">duckdb, pg, mysql, mssql, bigquery</text>

  <rect x="272" y="228" width="190" height="56" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="280" y="245" font-size="11" font-weight="600">/v1 pipeline (5 endpoints)</text>
  <text x="280" y="260" font-size="10.5">gatekeeper, router, agent,</text>
  <text x="280" y="274" font-size="10.5">verifier, repair (+ SSE)</text>

  <rect x="474" y="228" width="190" height="56" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="482" y="245" font-size="11" font-weight="600">RAG + memory</text>
  <text x="482" y="260" font-size="10.5">local embeddings, rerank,</text>
  <text x="482" y="274" font-size="10.5">recall</text>

  <rect x="272" y="292" width="190" height="40" fill="#fff7ed" stroke="#fdba74" rx="4"/>
  <text x="280" y="309" font-size="11" font-weight="600">/docs /openapi.json</text>
  <text x="280" y="323" font-size="10.5" fill="#b91c1c">unauthenticated Swagger UI</text>

  <rect x="474" y="292" width="190" height="40" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="482" y="309" font-size="11" font-weight="600">LLM gateway (LiteLLM)</text>
  <text x="482" y="323" font-size="10.5">per-tenant provider + key</text>

  <!-- data at rest (below backend) -->
  <rect x="260" y="396" width="200" height="82" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="270" y="414" font-size="11" font-weight="600">admin.db (SQLite, 16 tables)</text>
  <text x="270" y="430" font-size="10.5">tenants, MDL, roles, api_keys,</text>
  <text x="270" y="444" font-size="10.5">chunks+vectors, memories, logs</text>
  <text x="270" y="460" font-size="10.5" fill="#6b7280">3 secrets Fernet; rest plaintext</text>
  <text x="270" y="473" font-size="10.5" fill="#6b7280">+ 2 .bak copies</text>

  <rect x="472" y="396" width="100" height="82" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="482" y="414" font-size="11" font-weight="600">files/</text>
  <text x="482" y="430" font-size="10.5">original uploads</text>
  <text x="482" y="444" font-size="10.5">PDF, DOCX,</text>
  <text x="482" y="458" font-size="10.5">PPTX, MD, TXT</text>
  <text x="482" y="473" font-size="10.5" fill="#6b7280">plain on disk</text>

  <rect x="584" y="396" width="92" height="82" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="594" y="414" font-size="11" font-weight="600">gcloud ADC</text>
  <text x="594" y="430" font-size="10.5">operator's</text>
  <text x="594" y="444" font-size="10.5">personal</text>
  <text x="594" y="458" font-size="10.5">Google login</text>
  <text x="594" y="473" font-size="10.5" fill="#6b7280">%APPDATA%</text>

  <rect x="260" y="494" width="416" height="60" fill="#fef2f2" stroke="#fecaca" rx="4"/>
  <text x="270" y="512" font-size="11" font-weight="600" fill="#b91c1c">Vault residue (retired 2026-07-07, not decommissioned)</text>
  <text x="270" y="528" font-size="10.5">deploy/vault/persistent holds a live token in plaintext; the raft</text>
  <text x="270" y="542" font-size="10.5">docker volume still contains pre-migration copies of all secrets</text>

  <!-- INTERNET server boxes (all reachable straight from the backend's right edge) -->
  <rect x="720" y="84" width="212" height="48" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="730" y="103" font-size="11" font-weight="600">DeepSeek API</text>
  <text x="730" y="119" font-size="10.5">api.deepseek.com, HTTPS</text>
  <text x="730" y="129" font-size="9.5" fill="#6b7280">every chat turn, per-tenant key</text>

  <rect x="720" y="142" width="212" height="46" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="730" y="160" font-size="11" font-weight="600">Google BigQuery</text>
  <text x="730" y="176" font-size="10.5">bigquery.googleapis.com, HTTPS</text>
  <text x="730" y="185" font-size="9.5" fill="#6b7280">keyless via host ADC (Acme)</text>

  <rect x="720" y="198" width="212" height="42" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="730" y="216" font-size="11" font-weight="600">huggingface.co</text>
  <text x="730" y="231" font-size="10.5" fill="#6b7280">model weights at warmup / first use</text>

  <rect x="720" y="250" width="212" height="42" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="730" y="268" font-size="11" font-weight="600">raw.githubusercontent.com</text>
  <text x="730" y="283" font-size="10.5" fill="#6b7280">litellm price map, every start</text>

  <rect x="720" y="302" width="212" height="42" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="730" y="320" font-size="11" font-weight="600">pypi.org / registry.npmjs.org</text>
  <text x="730" y="335" font-size="10.5" fill="#6b7280">pip/npm install on every launch</text>

  <rect x="720" y="354" width="212" height="42" fill="#f7f8fa" stroke="#c8ccd4" rx="4"/>
  <text x="730" y="372" font-size="11" font-weight="600">github.com (repo remote)</text>
  <text x="730" y="387" font-size="10.5" fill="#6b7280">source push/pull, manual</text>

  <rect x="720" y="406" width="212" height="58" fill="#fff7ed" stroke="#fdba74" rx="4"/>
  <text x="730" y="424" font-size="11" font-weight="600">Google Fonts + cdn.jsdelivr.net</text>
  <text x="730" y="440" font-size="10.5">reached from the admin browser,</text>
  <text x="730" y="454" font-size="10.5" fill="#b91c1c">not the server (d3 + GeoJSON, no SRI)</text>

  <!-- ARROWS -->
  <!-- inbound (blue, horizontal) -->
  <line x1="212" y1="148" x2="260" y2="148" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="216" y="142" font-size="9.5" fill="#2563eb">HTTP /admin</text>
  <line x1="212" y1="252" x2="260" y2="252" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="216" y="246" font-size="9.5" fill="#2563eb">HTTP /v1</text>

  <!-- backend queries on-LAN MySQL (leftward, horizontal, clear of inbound arrows) -->
  <line x1="260" y1="360" x2="212" y2="360" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="150" y="424" font-size="9.5" fill="#4b5563">governed SELECT</text>

  <!-- backend -> internet, parallel horizontals from the right edge (no crossing) -->
  <line x1="676" y1="108" x2="720" y2="108" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="676" y1="165" x2="720" y2="165" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="676" y1="219" x2="720" y2="219" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="676" y1="271" x2="720" y2="271" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="676" y1="323" x2="720" y2="323" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="676" y1="375" x2="720" y2="375" stroke="#4b5563" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="20" y="588" font-size="10" fill="#6b7280">Solid grey lines are outbound connections the backend makes. Blue lines are inbound calls. The Google/CDN box is loaded by the admin browser, not the server.</text>
</svg>
